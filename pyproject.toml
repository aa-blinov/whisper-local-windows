[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lazy-to-text"
version = "0.0.1"
description = "Hotkey STT client for remote faster-whisper backend (Windows)"
readme = "README.md"
authors = [
    {name = "Alexander Blinov", email = "iam@blinovcorp.ru"}
]
requires-python = ">=3.12"
urls = { Homepage = "https://github.com/aa-blinov/lazy-to-text" }
dependencies = [
    "numpy>=2.4.4",
    "sounddevice>=0.5.5",
    "global-hotkeys>=0.1.7; platform_system=='Windows'",
    "pyperclip>=1.11.0",
    "ruamel.yaml>=0.19.1",
    "pywin32>=311; platform_system=='Windows'",
    "pyautogui>=0.9.54; platform_system=='Windows'",
    "requests>=2.33.1",
    "pyyaml>=6.0.3",
    "pyinstaller>=6.20.0",
    "pyside6>=6.11.0",
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.8",
    "nvidia-cudnn-cu12>=9.0",
    "torch>=2.0",
    "torchaudio>=2.0",
    "psutil>=6.0",
    # Used by the resource monitor in the topbar to report GPU VRAM /
    # utilisation. Falls back gracefully on machines without an
    # NVIDIA driver — the widget just hides the GPU bar.
    "nvidia-ml-py>=12.0",
    # ``[longform]`` pulls in pyannote-audio for VAD-based segmentation
    # so ``model.transcribe_longform`` works on captures > 25 seconds.
    # Requires the user to have accepted the gated
    # ``pyannote/segmentation-3.0`` model on Hugging Face with
    # ``HF_TOKEN`` set; without that, ``transcribe_longform`` will
    # raise and we fall back to plain ``transcribe``.
    "gigaam[longform] @ git+https://github.com/salute-developers/GigaAM",
]

[project.scripts]
lazy-to-text-ui = "app.gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["assets/**/*", "gui/styles/*.qss"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
filterwarnings = [
    "ignore::DeprecationWarning",
]
