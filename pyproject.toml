[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lazy-to-text"
version = "0.0.1"
description = "Local ONNX speech-to-text desktop client with global-hotkey dictation and file transcription (Windows + macOS)"
readme = "README.md"
authors = [
    {name = "Alexander Blinov", email = "iam@blinovcorp.ru"}
]
requires-python = ">=3.12"
urls = { Homepage = "https://github.com/aa-blinov/lazy-to-text" }
dependencies = [
    "numpy>=2.4.4",
    "sounddevice>=0.5.5",
    # Windows-only global-hotkeys library (RegisterHotKey).  On
    # macOS / Linux the listener uses ``pynput`` instead.
    "global-hotkeys>=0.1.7; platform_system=='Windows'",
    "pyperclip>=1.11.0",
    "pywin32>=311; platform_system=='Windows'",
    # Cross-platform now: used for auto-paste hotkey simulation on
    # macOS (Cmd+V) and Linux (Ctrl+V).  Windows path keeps its
    # native ``win32api.keybd_event`` route via ``pywin32``.
    "pyautogui>=0.9.54",
    "requests>=2.33.1",
    "pyyaml>=6.0.3",
    "pyside6>=6.11.0",
    "scipy>=1.11",
    # libsndfile bindings — fast in-process decoder for the
    # WAV / FLAC / OGG / OPUS / AIFF family used by the file-
    # transcribe view (and as a fast path before falling back to
    # ffmpeg).
    "soundfile>=0.12",
    # Static ffmpeg binary (~70 MB on Windows) bundled as a Python
    # wheel.  Used as the fallback decoder for everything libsndfile
    # can't handle: MP3 / M4A / AAC / WMA / WebM / MOV / MKV / AVI /
    # FLV / 3GP, etc.  Means the file-transcribe view accepts any
    # common audio or video container without making the user
    # install ffmpeg system-wide.
    "imageio-ffmpeg>=0.5",
    "psutil>=6.0",
    # GPU monitoring in the topbar (NVML).  Windows-only — Apple
    # Silicon has no NVIDIA path, and the Mac topbar shows CPU/RAM
    # only.
    "nvidia-ml-py>=12.0; platform_system=='Windows'",
    # The single ASR backend.  ``onnx-asr`` covers Whisper, GigaAM v3
    # and Parakeet TDT v3 via ONNX Runtime — no PyTorch, no NeMo, no
    # CTranslate2.  ``[gpu,hub]`` pulls ``onnxruntime-gpu`` (CUDA) on
    # Windows; ``[cpu,hub]`` pulls plain ``onnxruntime`` (which on
    # macOS auto-includes the CoreMLExecutionProvider) on every
    # other platform.  Both drop install size from ~4 GB (torch +
    # NeMo) to ~700 MB.
    "onnx-asr[gpu,hub]>=0.11.0; platform_system=='Windows'",
    "onnx-asr[cpu,hub]>=0.11.0; platform_system!='Windows'",
    # Cross-platform XDG / ~/Library / %LOCALAPPDATA% resolver —
    # replaces the hand-rolled ``_user_local_data_dir`` helper.
    "platformdirs>=4.0",
    # Cross-platform single-instance lock (replaces win32event
    # named-mutex on non-Windows).
    "filelock>=3.13",
    # Cross-platform global hotkey listener for non-Windows
    # platforms.  Windows keeps ``global-hotkeys`` for backward
    # compatibility with the existing native binding.
    "pynput>=1.7; platform_system!='Windows'",
    # Cross-platform sound playback for non-Windows platforms
    # (Windows keeps ``winsound`` from stdlib).  Uses AppKit on
    # macOS, GStreamer / aplay on Linux.
    "playsound3>=3.2; platform_system!='Windows'",
]

[project.scripts]
lazy-to-text-ui = "app.gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["assets/**/*", "gui/styles/*.qss"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
filterwarnings = [
    "ignore::DeprecationWarning",
]
