whisper:
  model: parakeet-tdt-v3-onnx
  language: ru
  beam_size: 20
  compute_type: float32
hotkey:
  start_recording_hotkey: ctrl+f2
  stop_recording_hotkey: ctrl+f3
  cancel_recording_hotkey: ctrl+f6
audio:
  channels: 1
  dtype: float32
  max_duration: 300
  device: 31
clipboard:
  auto_paste: 1
  preserve_clipboard: false
  key_simulation_delay: 0.05
logging:
  level: INFO
  file:
    enabled: true
    filename: app.log
    rotation:
      enabled: true
      max_bytes: 1048576
      backup_count: 5
      encoding: utf-8
  console:
    enabled: true
    level: WARNING
audio_feedback:
  enabled: true
  start_sound: assets/sounds/record_start.wav
  stop_sound: assets/sounds/record_stop.wav
  cancel_sound: assets/sounds/record_cancel.wav
system_tray:
  enabled: true
  tooltip: Lazy to text
history:
  enabled: true
  max_entries: 1000
  auto_cleanup_days: 30
storage:
  models_dir: ''
huggingface:
  token: ''
